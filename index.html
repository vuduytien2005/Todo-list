<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Việc hôm nay</title>
  <!-- Nạp file CSS để tạo giao diện -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Việc hôm nay cần làm</h1>

    <!-- Form nhập việc mới. Dùng <form> để nhấn Enter cũng gửi được -->
    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="Hôm nay bạn cần làm gì?"
        autocomplete="off"
      >
      <!-- Chọn hạn chót (không bắt buộc). type="date" cho ra lịch chọn ngày -->
      <input id="todo-date" type="date" title="Hạn chót (không bắt buộc)">
      <button type="submit">Thêm</button>
    </form>

    <!-- Bộ lọc. data-filter là "nhãn" để JavaScript biết nút nào lọc gì -->
    <div id="filters" class="filters">
      <button type="button" class="filter-btn active" data-filter="all">Tất cả</button>
      <button type="button" class="filter-btn" data-filter="done">Đã xong</button>
      <button type="button" class="filter-btn" data-filter="active">Chưa xong</button>
    </div>

    <!-- Bảng việc. <thead> là hàng tiêu đề, JavaScript tự điền các hàng vào <tbody> -->
    <div class="table-wrap">
      <table class="todo-table">
        <thead>
          <tr>
            <th class="col-check"></th>
            <th class="col-text">Nội dung</th>
            <th class="col-status">Hạn</th>
            <th class="col-date">Ngày</th>
            <th class="col-delete"></th>
          </tr>
        </thead>
        <tbody id="todo-list"></tbody>
      </table>
    </div>

    <!-- Dòng đếm số việc chưa xong -->
    <p id="todo-count" class="todo-count"></p>
  </main>

  <!-- Nạp JavaScript ở cuối body để HTML đã có sẵn khi script chạy -->
  <script src="script.js"></script>
</body>
</html>
